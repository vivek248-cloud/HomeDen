<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        /* Glitch Effect */
        .error-code {
            font-size: 150px;
            font-weight: 900;
            position: relative;
            letter-spacing: 10px;
            animation: float 3s ease-in-out infinite;
        }

        .error-code::before,
        .error-code::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }

        .error-code::before {
            color: #ff00ff;
            z-index: -1;
            animation: glitch1 2s infinite;
        }

        .error-code::after {
            color: #00ffff;
            z-index: -1;
            animation: glitch2 2s infinite;
        }

        .message {
            font-size: 28px;
            margin: 20px 0 10px;
            color: #ccc;
        }

        .sub-message {
            font-size: 16px;
            color: #888;
            margin-bottom: 40px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.6;
        }

        /* Buttons */
        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.6);
        }

        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: #fff;
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 255, 255, 0.1);
        }

        /* Floating Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise linear infinite;
        }

        /* Astronaut SVG */
        .astronaut {
            width: 120px;
            margin-bottom: 20px;
            animation: float 4s ease-in-out infinite;
        }

        /* Search Bar */
        .search-bar {
            margin-top: 30px;
            display: flex;
            justify-content: center;
        }

        .search-bar input {
            padding: 12px 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px 0 0 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            width: 280px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-bar input::placeholder {
            color: #666;
        }

        .search-bar input:focus {
            border-color: #667eea;
        }

        .search-bar button {
            padding: 12px 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-left: none;
            border-radius: 0 50px 50px 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.3s;
        }

        .search-bar button:hover {
            opacity: 0.85;
        }

        /* Animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glitch1 {
            0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
            20% { clip-path: inset(20% 0 60% 0); transform: translate(-5px, -3px); }
            40% { clip-path: inset(50% 0 20% 0); transform: translate(5px, 3px); }
            60% { clip-path: inset(10% 0 70% 0); transform: translate(-3px, 2px); }
            80% { clip-path: inset(80% 0 5% 0); transform: translate(3px, -2px); }
        }

        @keyframes glitch2 {
            0%, 100% { clip-path: inset(0 0 0 0); transform: translate(0); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(5px, 3px); }
            40% { clip-path: inset(30% 0 40% 0); transform: translate(-5px, -3px); }
            60% { clip-path: inset(70% 0 10% 0); transform: translate(3px, -2px); }
            80% { clip-path: inset(5% 0 80% 0); transform: translate(-3px, 2px); }
        }

        @keyframes rise {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 600px) {
            .error-code {
                font-size: 80px;
            }
            .message {
                font-size: 20px;
            }
            .search-bar input {
                width: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <div class="container">

        <!-- Astronaut Icon -->
        <svg class="astronaut" viewBox="0 0 128 128" fill="none">
            <circle cx="64" cy="50" r="30" fill="#ddd" stroke="#999" stroke-width="2"/>
            <rect x="48" y="38" width="32" height="20" rx="8" fill="#333"/>
            <rect x="50" y="40" width="28" height="16" rx="6" fill="#1a1a2e"/>
            <ellipse cx="64" cy="48" rx="10" ry="6" fill="rgba(102,126,234,0.3)"/>
            <rect x="50" y="75" width="28" height="30" rx="8" fill="#ddd" stroke="#999" stroke-width="2"/>
            <rect x="40" y="80" width="12" height="6" rx="3" fill="#ddd" stroke="#999" stroke-width="2"/>
            <rect x="76" y="80" width="12" height="6" rx="3" fill="#ddd" stroke="#999" stroke-width="2"/>
            <rect x="52" y="102" width="10" height="14" rx="4" fill="#ddd" stroke="#999" stroke-width="2"/>
            <rect x="66" y="102" width="10" height="14" rx="4" fill="#ddd" stroke="#999" stroke-width="2"/>
            <circle cx="58" cy="85" r="3" fill="#667eea"/>
            <circle cx="64" cy="92" r="2" fill="#764ba2"/>
            <circle cx="70" cy="85" r="3" fill="#667eea"/>
        </svg>

        <!-- Error Code with Glitch -->
        <div class="error-code">404</div>

        <!-- Messages -->
        <p class="message">Oops! Page Not Found</p>
        <p class="sub-message">
            The page you're looking for has drifted into space.
            It might have been moved, deleted, or never existed.
        </p>

        <!-- Action Buttons -->
        <div class="buttons">
            <a href="/" class="btn btn-primary">🏠 Go Home</a>
            <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
        </div>

        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" placeholder="Search for pages..." id="searchInput">
            <button onclick="searchSite()">Search</button>
        </div>
    </div>

    <script>
        // Generate floating particles
        const particlesContainer = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.style.left = Math.random() * 100 + '%';
            particle.style.width = particle.style.height = Math.random() * 4 + 2 + 'px';
            particle.style.animationDuration = Math.random() * 8 + 5 + 's';
            particle.style.animationDelay = Math.random() * 5 + 's';
            particle.style.background = `rgba(${Math.random() > 0.5 ? '102,126,234' : '118,75,162'}, ${Math.random() * 0.5 + 0.2})`;
            particlesContainer.appendChild(particle);
        }

        // Search function
        function searchSite() {
            const query = document.getElementById('searchInput').value;
            if (query.trim()) {
                // Change this URL to your site's search page
                window.location.href = `/search?q=${encodeURIComponent(query)}`;
            }
        }

        // Enter key for search
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') searchSite();
        });
    </script>

</body>
</html>
