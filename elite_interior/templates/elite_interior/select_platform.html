{% extends 'elite_interior/base.html' %}

{% load format_extras %}
{% load i18n %}
{% load static %}
{% block extra_css %}

{% endblock %}


{% block content %}

<div class="container py-5" style="margin-top: 100px;">
  <div class="card shadow border-0 rounded-4 px-3 px-md-5 py-4 bg-white">
    <h2 class="text-center fw-bold mb-4 text-dark">
      <span class="text-muted">Select a Platform</span>
    </h2>
        <form method="post">
    {% csrf_token %}
    <div class="row g-3">

        <div class="col-sm-6">
            <label for="platform_kitchen" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="kitchen"
                       id="platform_kitchen"
                       required>
                <span class="fw-semibold">Kitchen</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_bedroom" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="bedroom"
                       id="platform_bedroom">
                <span class="fw-semibold">Bedroom</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_dining" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="dining"
                       id="platform_dining">
                <span class="fw-semibold">Dining</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_bathroom" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="bathroom"
                       id="platform_bathroom">
                <span class="fw-semibold">Bathroom</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_livingroom" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="living"
                       id="platform_livingroom">
                <span class="fw-semibold">Living Room</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_kidsroom" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="kids"
                       id="platform_kidsroom">
                <span class="fw-semibold">Kids Room</span>
            </label>
        </div>

        <div class="col-sm-6">
            <label for="platform_wardrobes" class="form-check border shadow-sm rounded-3 p-3 h-100 bg-light w-100">
                <input class="form-check-input me-2"
                       type="radio"
                       name="platform"
                       value="wardrobes"
                       id="platform_wardrobes">
                <span class="fw-semibold">Wardrobes</span>
            </label>
        </div>

    </div>

    <button type="submit" class="btn btn-success rounded-pill px-4 mt-4">Submit</button>
</form>


    </div>
</div>    

{% endblock %}
