{% extends "layout.html" %}
{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-xl-6 col-lg-8">
            
            <div class="text-center mb-5">
                <div class="bg-success-subtle d-inline-block rounded-circle p-4 mb-3">
                    <i class="bi bi-pencil-square text-success fs-1"></i>
                </div>
                <h2 class="fw-bold text-dark">Modify Series Rate</h2>
                <p class="text-muted">Updating rates will not affect existing quotations but will apply to all new ones for <strong>{{ item.name }}</strong>.</p>
            </div>

            <form method="post">
                {% csrf_token %}

                <div class="card border-0 shadow-sm rounded-4 overflow-hidden mb-4">
                    <div class="card-header bg-white border-bottom-0 py-3 px-4">
                        <span class="text-uppercase fw-bold text-secondary small" style="letter-spacing: 1px;">Series Editor</span>
                    </div>
                    <div class="card-body p-4 p-md-5 pt-2">
                        
                        <div class="form-floating mb-4">
                            <input type="text" name="name" 
                                   value="{{ item.name }}" 
                                   class="form-control border-0 bg-light rounded-3" 
                                   id="nameInput" placeholder="Series Name" required>
                            <label for="nameInput" class="text-muted">Series Name</label>
                        </div>

                        <div class="form-group mb-2">
                            <label class="form-label small fw-bold text-secondary text-uppercase ms-1">Updated Rate (Per Sq.Ft)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text border-0 bg-success text-white rounded-start-3">₹</span>
                                <input type="number" step="0.01" name="rate" 
                                       value="{{ item.rate }}" 
                                       class="form-control border-0 bg-light rounded-end-3 fw-bold" 
                                       placeholder="0.00" required>
                            </div>
                        </div>

                    </div>
                </div>

                <div class="d-flex align-items-center justify-content-between px-2">
                    <a href="{% url 'fullsemi_index' %}" class="btn btn-link text-white bg-danger text-decoration-none fw-semibold py-3 px-5 rounded-4">
                        <i class="bi bi-x-circle me-2"></i>Discard Changes
                    </a>
                    <button type="submit" class="btn btn-success px-5 py-3 rounded-4 fw-bold shadow-success-grow">
                        Update Configuration <i class="bi bi-check2-all ms-2"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    /* Success glow for Edit mode */
    .shadow-success-grow {
        box-shadow: 0 10px 20px -5px rgba(25, 135, 84, 0.4);
        transition: all 0.3s ease;
    }
    
    .shadow-success-grow:hover {
        box-shadow: 0 12px 25px -5px rgba(25, 135, 84, 0.5);
        transform: translateY(-2px);
    }

    /* Focus states */
    .form-control:focus {
        background-color: #ffffff !important;
        box-shadow: 0 0 0 4px rgba(25, 135, 84, 0.1) !important;
        border: 1px solid #198754 !important;
    }

    .bg-success-subtle {
        background-color: #e1f3e8 !important;
    }

    .input-group-text {
        min-width: 50px;
        justify-content: center;
    }
</style>

{% endblock %}
