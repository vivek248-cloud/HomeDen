<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation System</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-accent: #3751ff;
            --bg-subtle: #f4f7fe;
            --text-main: #2b3674;
        }

        body { 
            background-color: var(--bg-subtle); 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Modern Sidebar Navigation */
        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: #fff;
            border-right: 1px solid #e0e5f2;
            z-index: 1000;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .brand-logo {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 1.25rem;
            color: var(--primary-accent);
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-pills .nav-link {
            color: #a3aed0;
            font-weight: 500;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .nav-pills .nav-link:hover {
            background: #f7f9ff;
            color: var(--primary-accent);
        }

        .nav-pills .nav-link.active {
            background: var(--primary-accent);
            color: #fff;
            box-shadow: 0px 10px 20px rgba(55, 81, 255, 0.2);
        }

        /* Main Content Area */
        .main-wrapper {
            margin-left: var(--sidebar-width);
            padding: 2rem;
            min-height: 100vh;
        }

        /* Top Bar / Header */
        .top-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 0.75rem 1.5rem;
            margin-bottom: 2rem;
            border: 1px solid #fff;
            box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Cards & Tables UI */
        .card {
            border: none;
            border-radius: 20px;
            box-shadow: 14px 17px 40px 4px rgba(112, 144, 176, 0.08);
        }

        .table thead th {
            background-color: transparent;
            color: #a3aed0;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e0e5f2;
            padding: 1rem;
        }

        /* Custom Form Controls */
        .form-control {
            border-radius: 12px;
            border: 1px solid #e0e5f2;
            padding: 0.6rem 1rem;
        }

        .form-control:focus {
            box-shadow: 0 0 0 4px rgba(55, 81, 255, 0.1);
            border-color: var(--primary-accent);
        }

        /* Action Buttons */
        .btn-primary {
            background-color: var(--primary-accent);
            border: none;
            border-radius: 12px;
            padding: 0.6rem 1.5rem;
            font-weight: 600;
        }

        @media (max-width: 992px) {
            .sidebar { transform: translateX(-100%); }
            .main-wrapper { margin-left: 0; }
            .sidebar.show { transform: translateX(0); }
        }
    </style>
</head>
<body>

<aside class="sidebar" id="sidebar">
    <div class="brand-logo">
        <i class="bi bi-graph-up-arrow"></i>
        <span>QuotationSys</span>
    </div>

    <ul class="nav nav-pills flex-column">
        <li class="nav-item">
            <a class="nav-link {% if 'dashboard' in request.path %}active{% endif %}" href="{% url 'dashboard' %}">
                <i class="bi bi-file-earmark-text"></i> Dashboard
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'quotation' in request.path %}active{% endif %}" href="{% url 'quotation_index' %}">
                <i class="bi bi-file-earmark-text"></i> Quotations
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'clients' in request.path %}active{% endif %}" href="{% url 'client_index' %}">
                <i class="bi bi-people"></i> Clients
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'fullsemi' in request.path %}active{% endif %}" href="{% url 'fullsemi_index' %}">
                <i class="bi bi-person-badge"></i> Full Semi
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link {% if 'image' in request.path %}active{% endif %}" href="{% url 'image_index' %}">
                <i class="bi bi-images"></i> Assets
            </a>
        </li>
    </ul>

    <div class="mt-auto pt-4 border-top" style="position: absolute; bottom: 20px; width: calc(100% - 3rem);">
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="btn btn-link text-danger text-decoration-none nav-link w-100 text-start px-3">
                <i class="bi bi-box-arrow-left me-2"></i> Logout
            </button>
        </form>
    </div>
</aside>

<main class="main-wrapper">
    
    <header class="top-nav">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb mb-0">
                <li class="breadcrumb-item text-muted">Pages</li>
                <li class="breadcrumb-item active fw-bold" aria-current="page" >Dashboard</li>
            </ol>
        </nav>

        <div class="d-flex align-items-center gap-3">
            <div class="dropdown">
                <div class="d-flex align-items-center gap-3 cursor-pointer" data-bs-toggle="dropdown" style="cursor: pointer;">
                    <div class="text-end d-none d-md-block">
                        <p class="mb-0 fw-bold" style="font-size: 0.85rem;">{{ request.user.username }}</p>
                        <small class="text-muted" style="font-size: 0.75rem;">Administrator</small>
                    </div>
                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold"
                         style="width:40px; height:40px; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                         {{ request.user.username|slice:":1"|upper }}
                    </div>
                </div>
                <ul class="dropdown-menu dropdown-menu-end border-0 shadow-lg mt-3">
                    <li><a class="dropdown-item py-2" href="#"><i class="bi bi-person me-2"></i> Profile Settings</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <form method="post" action="{% url 'logout' %}">
                            {% csrf_token %}
                            <button class="dropdown-item text-danger py-2"><i class="bi bi-box-arrow-right me-2"></i> Sign Out</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <div class="content-body">
        {% block content %}{% endblock %}
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
