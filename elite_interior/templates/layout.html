<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotation System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; }
        
        /* Modern Navbar */
        .navbar-custom {
            background-color: #1a1a1a;
            padding: 0.75rem 1rem;
        }
        .navbar-custom .nav-link {
            color: rgba(255,255,255,0.8);
            font-weight: 500;
            margin-right: 1rem;
        }
        .navbar-custom .nav-link:hover {
            color: #fff;
        }
        
        /* Fix for your custom table conflicts */
        .table-responsive {
            border-radius: 12px;
        }

        .date-field{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.date-field label{
    font-size:13px;
    color:#555;
}

.date-field input{
    padding:8px 10px;
    border:1px solid #ddd;
    border-radius:8px;
    background:#f9fafb;
}

.date-field input:focus{
    outline:none;
    border-color:#3751ff;
    background:white;
}


.image-pick{
    cursor:pointer;
    transition:.2s;
}
.image-pick:hover{
    transform:scale(1.05);
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}


/* 1. Grid Visualization Fix */
    #quoteTable th, #quoteTable td {
        border-right: 1px solid #e9ecef !important;
    }

    
    .bg-light-input:focus {
        background-color: #ffffff !important;
        border-color: #0d6efd !important;
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15) !important;
        outline: none;
    }

    /* 3. Improved Sticky Column for Actions */
    .sticky-end {
        position: sticky;
        right: 0;
        z-index: 2;

        border-left: 2px solid #dee2e6 !important;
    }

    .shadow-sm-left {
        box-shadow: -5px 0 10px -5px rgba(0,0,0,0.05);
    }

    /* 4. Scrollbar Styling for better UX */
    .table-responsive::-webkit-scrollbar { height: 8px; }
    .table-responsive::-webkit-scrollbar-track { background: #f1f1f1; }
    .table-responsive::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
    .table-responsive::-webkit-scrollbar-thumb:hover { background: #999; }


    .spec-box{
    position:relative;
}

.spec-text{
    
    resize:none;
    padding-right:45px;
}

.copy-btn{
    position:absolute;
    top:5px;
    right:5px;
    font-size:11px;
}
.navbar .nav-link.active{
    color:#fff !important;
    font-weight:600;
}

.navbar .form-control{
    min-width:220px;
}

.navbar-brand{
    letter-spacing:.5px;
}

.container{
    width:100% !important;
}
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container-fluid">

        <!-- Brand -->
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            📊 QuotationSys
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">

            <!-- Navigation -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-2">
                <li class="nav-item">
                    <a class="nav-link {% if 'quotation' in request.path %}active{% endif %}" href="{% url 'quotation_index' %}">
                        QUOTATIONS
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'clients' in request.path %}active{% endif %}" href="{% url 'client_index' %}">
                        CLIENTS
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'fullsemi' in request.path %}active{% endif %}" href="{% url 'fullsemi_index' %}">
                        FULL/SEMI-SPECIALISTS
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if 'image' in request.path %}active{% endif %}" href="{% url 'image_index' %}">
                        IMAGES
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">



                <!-- User Profile Dropdown -->
                <div class="dropdown">

                    <button class="btn btn-outline-light rounded-pill d-flex align-items-center gap-2 px-3"
                            data-bs-toggle="dropdown">

                        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center"
                            style="width:32px;height:32px;">
                            {{ request.user.username|slice:":1"|upper }}
                        </div>

                        <span class="d-none d-md-inline">{{ request.user.username }}</span>
                        <i class="bi bi-chevron-down"></i>
                    </button>

                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">

                        <li class="px-3 py-2 text-muted small">
                            Logged in as<br>
                            <strong>{{ request.user.username }}</strong>
                        </li>

                        <li><hr class="dropdown-divider"></li>

                        <li>
                            <form method="post" action="{% url 'logout' %}">
                                {% csrf_token %}
                                <button class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i> Logout
                                </button>
                            </form>
                        </li>
                    </ul>

                </div>

            </div>


        </div>
    </div>
</nav>


<div class="container">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
