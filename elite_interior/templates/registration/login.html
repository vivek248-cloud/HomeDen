<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
<title>Login</title>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen">

<div class="w-full max-w-md p-8 bg-white rounded-xl shadow-lg">

<h2 class="text-3xl font-extrabold text-center mb-2">Welcome Back</h2>
<p class="text-center text-gray-500 mb-6">Sign in to continue</p>

{% if messages %}
{% for message in messages %}
<p class="text-red-500 text-sm mb-3 text-center">{{ message }}</p>
{% endfor %}
{% endif %}

<form method="post" class="space-y-4">
{% csrf_token %}

<input 
    type="text" 
    name="username"
    placeholder="Username"
    required
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-indigo-300">

<input 
    type="password" 
    name="password"
    placeholder="Password"
    required
    class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-indigo-300">

<button 
    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-lg font-semibold">
    Sign In
</button>

</form>

</div>

</body>
</html>
